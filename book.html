<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Table | After Hours</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600;1,700;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="components.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>

  <!-- Navigation -->
  <site-header></site-header>

  <!-- Page Intro -->
  <section class="page-intro">
    <p class="eyebrow yellow">NO PRESSURE</p>
    <h1>So... are<br><em>you coming?</em></h1>
  </section>

  <main class="page-body">
    <div class="booking-container">
      <form class="booking-form" id="bookingForm" data-testid="booking-form">
        
        <div class="form-row">
          <div class="form-group">
            <label class="eyebrow">DATE</label>
            <input type="date" name="date" required data-testid="book-date">
          </div>
          <div class="form-group">
            <label class="eyebrow">TIME</label>
            <select name="time" required data-testid="book-time">
              <option value="" disabled selected>Pick a time</option>
              <option value="18:00">6:00 PM</option>
              <option value="19:00">7:00 PM</option>
              <option value="20:00">8:00 PM</option>
              <option value="21:00">9:00 PM</option>
              <option value="22:00">10:00 PM</option>
              <option value="23:00">11:00 PM</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="eyebrow">NUMBER OF PEOPLE</label>
            <select name="people" required data-testid="book-people">
              <option value="1">1</option>
              <option value="2" selected>2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10+">10+</option>
            </select>
          </div>
          <div class="form-group">
            <label class="eyebrow">OCCASION</label>
            <select name="occasion" required data-testid="book-occasion">
              <option value="Just hanging out" selected>Just hanging out</option>
              <option value="Birthday">Birthday</option>
              <option value="Date">Date</option>
              <option value="Business but cool">Business but cool</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="eyebrow">YOUR NAME</label>
          <input type="text" name="name" placeholder="Who's coming?" required data-testid="book-name">
        </div>

        <div class="form-group">
          <label class="eyebrow">EMAIL</label>
          <input type="email" name="email" placeholder="For the tiny confirmation" required data-testid="book-email">
        </div>

        <div class="form-group">
          <label class="eyebrow">SPECIAL REQUEST</label>
          <textarea name="request" placeholder="Birthday candles? Window seat?" data-testid="book-request"></textarea>
        </div>

        <button type="submit" class="button button-red form-submit" data-testid="book-submit">
          FIND A TABLE 
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"></path><path d="M7 7h10v10"></path></svg>
        </button>

      </form>

      <div class="booking-success" id="bookingSuccess" style="display: none;">
        <h2>Table Saved.</h2>
        <p>We'll see you soon. Check your email for details.</p>
        <button class="button button-red" onclick="window.location.reload()">Book another</button>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <site-footer></site-footer>

</body>
</html>
