<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Midnight Vibes</title>
  <link rel="stylesheet" href="styles.css">
  <script src="components.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>

  <!-- Navigation -->
  <site-header></site-header>

  <!-- Page Intro -->
  <section class="page-intro">
    <p class="eyebrow yellow">GET IN TOUCH</p>
    <h1>Leave your<br><em>mark.</em></h1>
    <p style="margin-top: 1.5rem; color: var(--text-muted-light); font-size: 1.1rem; max-width: 600px;">Good stories have a way of sticking around. Drop us a line or add yours to the Wall of Fame.</p>
  </section>

  <!-- Contact Form -->
  <main class="page-body">
    <div class="booking-container">
    <form class="booking-form contact-form">
      <div class="form-group">
        <label for="name" class="eyebrow">Name / Handle</label>
        <input type="text" id="name" name="name" placeholder="@yourhandle" required>
      </div>
      
      <div class="form-group">
        <label for="contact-info" class="eyebrow">Email or Phone</label>
        <input type="text" id="contact-info" name="contact-info" placeholder="So we can reply" required>
      </div>
      
      <div class="form-group">
        <label for="message" class="eyebrow">Message / Note</label>
        <textarea id="message" name="message" placeholder="What's your story?" required></textarea>
      </div>
      
      <button type="submit" class="button button-red form-submit">
        Send it
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 17L17 7"></path>
          <path d="M7 7h10v10"></path>
        </svg>
      </button>
    </form>
  </div>
  </main>

  <!-- Footer -->
  <site-footer></site-footer>
</body>
</html>
