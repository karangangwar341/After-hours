<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | After Hours</title>
  <link rel="stylesheet" href="styles.css">
  <script src="components.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>

  <!-- Navigation -->
  <site-header></site-header>

  <!-- Page Intro -->
  <section class="page-intro">
    <p class="eyebrow yellow">PROOF WE WERE HERE</p>
    <h1>A little messy.<br><em>Very much alive.</em></h1>
  </section>

  <!-- Main Body: Gallery Grid -->
  <main class="page-body">
    <div class="gallery-full-grid">
      <!-- Item 1 -->
      <figure class="gallery-card" data-testid="gallery-card-0">
        <img src="assets/gallery_people.jpg" alt="Friends laughing">
        <figcaption>THE PEOPLE</figcaption>
      </figure>

      <!-- Item 2 -->
      <figure class="gallery-card" data-testid="gallery-card-1">
        <img src="assets/gallery_food.jpg" alt="Hands reaching for dinner">
        <figcaption>THE FOOD</figcaption>
      </figure>

      <!-- Item 3 -->
      <figure class="gallery-card" data-testid="gallery-card-2">
        <img src="assets/gallery_room.jpg" alt="The After Hours room">
        <figcaption>THE ROOM</figcaption>
      </figure>

      <!-- Item 4 -->
      <figure class="gallery-card" data-testid="gallery-card-3">
        <img src="assets/gallery_people.jpg" alt="Late night table">
        <figcaption>THE NIGHTS</figcaption>
      </figure>

      <!-- Item 5 -->
      <figure class="gallery-card" data-testid="gallery-card-4">
        <img src="assets/gallery_food.jpg" alt="Pizza for everyone">
        <figcaption>THE FOOD</figcaption>
      </figure>

      <!-- Item 6 -->
      <figure class="gallery-card" data-testid="gallery-card-5">
        <img src="assets/gallery_room.jpg" alt="Game night">
        <figcaption>THE NIGHTS</figcaption>
      </figure>
    </div>
  </main>

  <!-- Footer -->
  <site-footer></site-footer>

</body>
</html>
